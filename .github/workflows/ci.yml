name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash -n deploy/wildhaven.sh && bash tests/deploy.sh
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: ADMIN_TOKEN=ci-only-test docker compose config --quiet
      - run: docker build -t wildhaven:ci .
